server:
  port: 8080

spring:
  application:
    name: doc-rag

  # Async ingestion state machine (week 6): PostgreSQL holds document status/attempts/error.
  datasource:
    url: jdbc:postgresql://localhost:5432/docrag
    username: docrag
    password: docrag
    driver-class-name: org.postgresql.Driver
    hikari:
      # Boot even if PG is still warming up; queries fail loudly later instead of the app
      # refusing to start (same resilience stance as IndexInitializer).
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: docrag
    password: docrag
    listener:
      simple:
        # Consumer-side retry with backoff; after max-attempts the message is rejected.
        # default-requeue-rejected=false sends the reject to the DLQ (see RabbitConfig)
        # instead of hot-looping a poison message forever.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 5000
          multiplier: 2
        default-requeue-rejected: false

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  threads:
    virtual:
      enabled: true

elasticsearch:
  uris: http://localhost:9200
  index: doc_chunks
  connect-timeout-ms: 3000
  socket-timeout-ms: 30000

llm:
  # Aliyun Bailian (DashScope) OpenAI-compatible endpoint
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: ${LLM_API_KEY:}
  embedding-model: text-embedding-v4
  embedding-dimension: 1024   # text-embedding-v4 default; must match the ES index mapping
  chat-model: qwen-plus
  # Auxiliary model for query rewriting (short formulaic task - cheaper/faster model).
  # Blank falls back to chat-model.
  rewrite-model: qwen-turbo
  temperature: 0.1
  max-context-chars: 6000

rag:
  chunk-size: 500
  chunk-overlap: 80
  default-top-k: 8
  candidate-k: 30
  min-vector-score: 0.35
  rrf-k: 60
  enable-vector: true
  enable-lexical: true
  enable-rerank: false
  cache-ttl-seconds: 600
  lex-weight: 1.0
  vec-weight: 1.0
  rerank-min-candidates: 0   # skip rerank when fused candidates <= this; 0 = always rerank
  enable-rewrite: false      # LLM query rewriting before retrieval (A/B dimension)
  enable-compression: false  # sentence-level context compression (A/B dimension)
  compression-chunk-chars: 250

# Rerank provider: "jina" (TEI/Jina-compatible /rerank endpoint) or "dashscope"
# (Aliyun Bailian native text-rerank API, reuses llm.api-key).
# Only consulted when rag.enable-rerank=true.
rerank:
  provider: jina
  base-url: http://localhost:8081
  model: BAAI/bge-reranker-v2-m3
  api-key: ""

eval:
  cases-file: eval/sample-eval.jsonl

logging:
  level:
    root: INFO
    com.zzx.docrag: DEBUG

# Observability (week 7): Prometheus scrape endpoint + metrics UI.
# Custom meters: rag.answer (tags: cache, refused), rag.stage (tag: stage=
# rewrite/lexical/vector/fusion/rerank/generate), rag.context.chars,
# rag.ttft.millis, llm.tokens (tags: model, kind=prompt/completion).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
