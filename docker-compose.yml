services:
  postgres:
    image: postgres:16-alpine
    container_name: docrag-postgres
    environment:
      POSTGRES_DB: docrag
      POSTGRES_USER: docrag
      POSTGRES_PASSWORD: docrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: docrag-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: docrag-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: docrag
      RABBITMQ_DEFAULT_PASS: docrag
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (docrag/docrag) - queue depth is observable here
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: docrag-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Optional Chinese analyzer. Enable with:
  #   docker compose --profile zh up -d
  # Then set elasticsearch.analyzer=ik_max_word in application.yml.
  elasticsearch-zh:
    profiles: ["zh"]
    image: elasticsearch:8.15.3
    container_name: docrag-es-zh
    build:
      context: .
      dockerfile: Dockerfile.es-zh
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"

  # Observability stack. Enable with:
  #   docker compose --profile obs up -d
  # Prometheus scrapes the app on the host; Grafana (docrag/docrag, :3000) ships a
  # provisioned dashboard: answer rate/latency, stage timings, TTFT, token rate,
  # context chars (the compression gauge) and 5xx rate.
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.54.1
    container_name: docrag-prometheus
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.2.0
    container_name: docrag-grafana
    environment:
      GF_SECURITY_ADMIN_USER: docrag
      GF_SECURITY_ADMIN_PASSWORD: docrag
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  esdata:
