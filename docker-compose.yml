services:
  postgres:
    image: postgres:16-alpine
    container_name: docrag-postgres
    environment:
      POSTGRES_DB: docrag
      POSTGRES_USER: docrag
      POSTGRES_PASSWORD: docrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: docrag-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: docrag-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Optional Chinese analyzer. Enable with:
  #   docker compose --profile zh up -d
  # Then set elasticsearch.analyzer=ik_max_word in application.yml.
  elasticsearch-zh:
    profiles: ["zh"]
    image: elasticsearch:8.15.3
    container_name: docrag-es-zh
    build:
      context: .
      dockerfile: Dockerfile.es-zh
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"

volumes:
  pgdata:
  redisdata:
  esdata:
